name: Keep Render Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -sS --max-time 30 https://vibe-coding-platform-7wi5.onrender.com/api/health || true
